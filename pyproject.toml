[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gjp-erp-billing-mcp"
version = "0.1.0"
description = "基于 AgentScope 的 ERP AI 开单 MCP 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.5",
    "mcp>=1.28,<2",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic>=2.10,<3",
    "rich>=13,<16",
    "starlette>=0.41,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
gjp-cli = "gjp_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/erp_billing",
    "src/gjp_cli",
    "src/gjp_common",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
